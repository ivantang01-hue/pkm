<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>pkm — 個人圖鑑</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">◆</span>
        <div>
          <h1>pkm</h1>
          <p class="tagline">第一世代・個人圖鑑 / 第1世代ポケモン図鑑</p>
        </div>
      </div>
      <div class="toolbar">
        <label class="search-wrap">
          <span class="sr-only">搜尋名稱</span>
          <input id="search" type="search" placeholder="搜尋名稱 / 名前で検索…" autocomplete="off" />
        </label>
        <label class="filter-wrap">
          <span class="sr-only">屬性篩選</span>
          <select id="type-filter">
            <option value="">全部屬性 / すべてのタイプ</option>
          </select>
        </label>
      </div>
    </header>

    <main class="main">
      <section class="list-panel" aria-label="寶可夢列表">
        <div id="status" class="status" role="status">載入中…</div>
        <div id="grid" class="grid"></div>
      </section>

      <aside id="detail" class="detail-panel" aria-live="polite" hidden>
        <button type="button" id="detail-close" class="detail-close" aria-label="關閉">×</button>
        <div id="detail-body"></div>
      </aside>
    </main>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
